name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check


      - name: Session authentication regressions
        run: bun run test:session

      - name: Database compatibility regressions
        run: bun run test:database

      - name: Opik SDK compatibility regressions
        run: bun run test:opik

      - name: Chart adapter compatibility regressions
        run: bun run test:chart

      - name: Download transport and AI state security regressions
        run: bun run test:transport

      - name: Mastra telemetry security regressions
        run: bun run test:telemetry

      - name: Math rendering and Drizzle toolchain regressions
        run: bun run test:math-tooling

      - name: Scoped memory migration regressions
        run: bun run test:scoped-memory

      - name: Production build
        run: bun run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit all dependency severities
        run: bun audit --audit-level=low
