name: ci

on:
  workflow_dispatch:  # disabled on push/PR (experiment repo); run manually only
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check


