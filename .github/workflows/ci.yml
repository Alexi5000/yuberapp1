name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.4"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check


      - name: Session authentication regressions
        run: bun run test:session

      - name: Database compatibility regressions
        run: bun run test:database

      - name: Opik SDK compatibility regressions
        run: bun run test:opik

      - name: Chart adapter compatibility regressions
        run: bun run test:chart

      - name: Download transport and AI state security regressions
        run: bun run test:transport

      - name: Mastra telemetry security regressions
        run: bun run test:telemetry

      - name: Math rendering and Drizzle toolchain regressions
        run: bun run test:math-tooling

      - name: Scoped memory migration regressions
        run: bun run test:scoped-memory

      - name: Mastra provider and workflow compatibility
        run: bun run test:mastra

      - name: Application authorization and authentication regressions
        run: bun scripts/test-application-security.ts

      - name: Production build
        run: bun run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit all dependency severities
        run: bun audit --audit-level=low
